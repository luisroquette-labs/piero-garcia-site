name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # cache do .next para builds mais rápidos/estáveis
      - uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: .next/cache
          key: nextcache-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**') }}
          restore-keys: nextcache-${{ hashFiles('package-lock.json') }}-
      # retry 3x: next/font às vezes estoura o fetch de fonts.gstatic.com no runner.
      # NÃO é bypass — falha de verdade se as 3 tentativas falharem.
      - run: npm run build || (sleep 8 && npm run build) || (sleep 16 && npm run build)
        env:
          NEXT_PUBLIC_BASE_PATH: /piero-garcia-site
          NEXT_PUBLIC_SITE_URL: https://luisroquette-labs.github.io/piero-garcia-site
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
